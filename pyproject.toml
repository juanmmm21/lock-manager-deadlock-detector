[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lock-manager-deadlock-detector"
version = "0.1.0"
description = "A fine-grained two-phase locking manager with wait-for graph cycle detection for deadlock resolution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]

[project.urls]
Repository = "https://github.com/juanmmm21/lock-manager-deadlock-detector"

[project.scripts]
lock-manager-deadlock-detector = "lock_manager_deadlock_detector.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lock_manager_deadlock_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
